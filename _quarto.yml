website:
  title: "Abdul Baari Bakpa"
  description: >-
    I am a Predoctoral Research Assistant to Professor Clément Imbert in the Department of Economics at Sciences Po. I hold an MRes in Economics from Sciences Po and a BA in Economics from Kwame Nkrumah University of Science and Technology (KNUST), Ghana. I am a two-time Mastercard Foundation Scholar. My research interests include development, environmental, and public economics and political economy, with an empirical focus on Sub-Saharan Africa.
  site-url: https://abdulbaaribakpa.github.io
  repo-url: https://github.com/abdulbaaribakpa/abdulbaaribakpa.github.io
  image: profile.jpg
  twitter-card: true
